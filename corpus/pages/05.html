<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>05-渐变背景容器</title>
<style>
  * { box-sizing: border-box; }
  body {
    width: 960px; height: 540px; margin: 0;
    background: #F5F7FA;
    font-family: "DengXian", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #1A1A1A;
    position: relative;
  }
  h1 { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-weight: 700; }
</style>
</head>
<body data-ppt-id="body" data-ppt-role="section">
  <div data-ppt-id="bg-grad" data-ppt-raster="true" style="position:absolute; left:0; top:0; width:960px; height:540px; background:linear-gradient(135deg,#14365C,#1F4E79);"></div>
  <h1 data-ppt-id="title" style="position:absolute; left:64px; top:200px; font-size:56px; margin:0; color:#FFFFFF;">技术架构演进</h1>
  <p data-ppt-id="subtitle" style="position:absolute; left:64px; top:280px; font-size:26px; margin:0; color:#DDBB4F;">从单体到微服务的三年之路</p>
</body>
</html>
